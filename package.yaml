name:     webserver
version:  0.1.0.0
synopsis: wamu_M's webserver in haskell

default-extensions:
  - OverloadedStrings

dependencies:
  - base >= 4.7 && < 5
  - scotty
  - yaml
  - aeson
  - text
  - directory
  - filepath
  - random
  - wai-middleware-static
  - http-types
  - containers
  - ginger


executables:
  webserver:
    main: Main.hs
    source-dirs: src
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
